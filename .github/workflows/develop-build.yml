name: Develop Build & Push Docker Images

on:
  push:
    branches:
      - develop

jobs:
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Java Setup
      # -----------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # -----------------------------
      # Node Setup
      # -----------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # -----------------------------
      # Backend Build
      # -----------------------------
      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Build Spring Boot
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      # -----------------------------
      # Frontend Build
      # -----------------------------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React App
        working-directory: frontend
        run: npm run build

      # -----------------------------
      # Docker Login
      # -----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # Build Backend Image
      # -----------------------------
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t kotreshdm/springboot-api:develop \
            ./backend

      # -----------------------------
      # Push Backend Image
      # -----------------------------
      - name: Push Backend Docker Image
        run: |
          docker push kotreshdm/springboot-api:develop

      # -----------------------------
      # Build Frontend Image
      # -----------------------------
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t kotreshdm/react-app:develop \
            ./frontend

      # -----------------------------
      # Push Frontend Image
      # -----------------------------
      - name: Push Frontend Docker Image
        run: |
          docker push kotreshdm/react-app:develop

      # -----------------------------
      # Done
      # -----------------------------
      - name: Completed
        run: echo "✅ Docker images built and pushed successfully."
