name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Build Spring Boot
        working-directory: backend
        run: ./mvnw clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t kotreshdm/springboot-api:release ./backend

      - name: Push Backend Image
        run: |
          docker push kotreshdm/springboot-api:release

      - name: Build Frontend Image
        run: |
          docker build -t kotreshdm/react-app:release ./frontend

      - name: Push Frontend Image
        run: |
          docker push kotreshdm/react-app:release

      - name: Cleanup old Docker Hub release tags
        if: always()
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -e
          apt-get update && apt-get install -y jq
          repos=("springboot-api" "react-app")
          for repo in "${repos[@]}"; do
            echo "Cleaning up old release tags for $repo"
            tags=$(curl -sSf -u "$DOCKER_USERNAME:$DOCKER_PASSWORD" "https://hub.docker.com/v2/repositories/kotreshdm/$repo/tags/?page_size=100" \
              | jq -r '.results[] | select(.name | startswith("release")) | [.name, .last_updated] | @tsv' \
              | sort -k2r \
              | cut -f1)
            echo "$tags" | tail -n +6 | while read -r tag; do
              if [ -n "$tag" ]; then
                echo "Deleting $repo:$tag"
                curl -sSf -u "$DOCKER_USERNAME:$DOCKER_PASSWORD" -X DELETE "https://hub.docker.com/v2/repositories/kotreshdm/$repo/tags/$tag/"
              fi
            done
          done
