name: Main - Build & Push Docker Images

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: kotreshdm/springboot-api
  FRONTEND_IMAGE: kotreshdm/react-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ###################################################
      # Java
      ###################################################
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Build Spring Boot
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      ###################################################
      # Node
      ###################################################
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React
        working-directory: frontend
        run: npm run build

      ###################################################
      # Docker
      ###################################################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ###################################################
      # Backend Image
      ###################################################
      - name: Build Backend Image
        run: |
          docker build \
            -t $BACKEND_IMAGE:main \
            -t $BACKEND_IMAGE:$IMAGE_TAG \
            ./backend

      - name: Push Backend Image
        run: |
          docker push $BACKEND_IMAGE:main
          docker push $BACKEND_IMAGE:$IMAGE_TAG

      ###################################################
      # Frontend Image
      ###################################################
      - name: Build Frontend Image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:main \
            -t $FRONTEND_IMAGE:$IMAGE_TAG \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push $FRONTEND_IMAGE:main
          docker push $FRONTEND_IMAGE:$IMAGE_TAG

      ###################################################
      # Cleanup
      ###################################################
      - name: Cleanup old Docker Hub mian tags
        if: always()
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Cleanup old tags..."
